name: CraftLira Mobil APK Derleyici

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: CraftLira Mobil APK Üret (Tek Parça 140MB)
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Java 21 Kurulumu
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Python 3.12 Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Bağımlılıkları Yükle
        run: npm install

      - name: Tek Parça CraftLira Mobil APK'sını Derle (React + Oyun Motoru)
        run: python scripts/build_craftlira_client.py

      - name: Üretilen APK Dosyasını Doğrula
        run: |
          ls -la release-apk/
          du -h release-apk/CraftLira-Mobil.apk

      - name: CraftLira-Mobil.apk Dosyasını Yayınla (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: CraftLira-Mobil-APK
          path: release-apk/CraftLira-Mobil.apk
          retention-days: 30
