name: CraftLira Mobil APK Derleyici

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: CraftLira Mobil APK Üret
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Java 21 Kurulumu
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Proje Bağımlılıklarını Yükle
        run: npm install

      - name: CraftLira Web Arayüzünü Derle
        run: npm run build

      - name: Capacitor Android Senkronizasyonu
        run: npx cap sync android

      - name: Gradle İzinlerini Tanımla
        run: chmod +x android/gradlew

      - name: Android APK Derle (Gradle)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: APK Dosyasını İsimlendir
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/CraftLira-Mobil.apk

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Tek Parça CraftLira Oyun İstemcisini Derle (Rebrand Engine)
        run: |
          python scripts/rebrand_engine.py

      - name: CraftLira APK Dosyalarını Yayınla (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: CraftLira-Mobil-APK
          path: |
            release-apk/CraftLira.apk
            release-apk/CraftLira-Mobil.apk
          retention-days: 30
